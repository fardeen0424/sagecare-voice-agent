# Fish S2 Pro on SGLang-Omni: preprocessing -> AR engine -> DAC vocoder, all on GPU 0.
config_cls: S2ProPipelineConfig
model_path: /models/fish-s2-pro

stages:
  tts_engine:
    engine:
      # Weights + KV cache as a share of the whole GPU. The default (0.85) assumes the GPU to itself;
      # here vLLM holds 60% and STT ~3 GB. Preprocessing and the vocoder sit outside this budget.
      mem_fraction_static: 0.18
