# One GPU cell: three model services, LiveKit (WebRTC), Caddy (TLS) and the voice agent. Model ports bind to 127.0.0.1
# because Docker's own iptables rules would make a published port public even with ufw blocking it.
# LiveKit and Caddy use host networking instead, so ufw (scripts/open_ports.sh) decides what is public.

x-gpu: &gpu
  restart: always
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

x-health: &health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 15m

services:
  llm:
    <<: *gpu
    # vLLM 0.31.0, CUDA 13.0 (host driver >= 580), kernels for sm_90 (H100/H200) and sm_120 (RTX PRO 6000)
    image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    container_name: llm
    ipc: host # vLLM's processes share memory
    entrypoint: [vllm, serve]
    # --max-num-seqs 32: the default 1024 exceeds the hybrid model's recurrent-state (Mamba) blocks.
    # Images/video off (voice is text-only), 16K context, 60% of the GPU, thinking off.
    # MTP: the checkpoint's own multi-token-prediction head drafts 3 tokens per step (faster decode).
    command: >-
      /models/qwen3.8-27b-fp8
      --served-model-name qwen3.8-27b
      --max-model-len 16384
      --max-num-seqs 32
      --limit-mm-per-prompt '{"image": 0, "video": 0}'
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.60
      --enable-prefix-caching
      --reasoning-parser qwen3
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
    volumes:
      - /models/qwen3.8-27b-fp8:/models/qwen3.8-27b-fp8:ro
      - /srv/voice/.cache/vllm:/root/.cache/vllm
    ports: ["127.0.0.1:8000:8000"]
    healthcheck: { <<: *health, test: [CMD, curl, -fs, localhost:8000/health] }

  stt:
    <<: *gpu
    build: ./stt # our streaming WebSocket wrapper around Nemotron 3.5 ASR
    image: voice-stt:local
    container_name: stt
    depends_on: { llm: { condition: service_healthy } } # vLLM sizes its KV cache from free GPU memory
    volumes: [/models/nemotron-3.5-asr:/models/nemotron-3.5-asr:ro]
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  tts:
    <<: *gpu
    build: ./tts # SGLang-Omni serving Fish S2 Pro, streams audio while it is generated
    image: voice-tts:local
    container_name: tts
    depends_on: { stt: { condition: service_healthy } } # sizes itself from what vLLM and STT leave free
    ipc: host
    command: [sgl-omni, serve, --config, /app/s2pro.yaml, --port, "8002"]
    environment:
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor # compile caches survive restarts
      TRITON_CACHE_DIR: /cache/triton
      SPEAKER_SAMPLES_DIR: /voices # uploaded voices (deploy.sh registers "sage") survive restarts
    volumes:
      - /models/fish-s2-pro:/models/fish-s2-pro:ro
      - /srv/voice/.cache/tts:/cache
      - /srv/voice/data/tts-voices:/voices
    ports: ["127.0.0.1:8002:8002"]
    healthcheck: { <<: *health, test: [CMD, curl, -fs, localhost:8002/health] }

  livekit:
    image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    container_name: livekit
    restart: always
    network_mode: host # 10k UDP media ports: no per-port Docker proxies, and ufw applies
    env_file: ../.env
    entrypoint: [sh, -c, 'exec /livekit-server --config /etc/livekit.yaml --keys "$$LIVEKIT_API_KEY: $$LIVEKIT_API_SECRET"']
    volumes: [./livekit/livekit.yaml:/etc/livekit.yaml:ro]
    healthcheck: { <<: *health, test: [CMD, wget, -qO-, http://127.0.0.1:7880] }

  caddy:
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    container_name: caddy
    restart: always
    network_mode: host # serves 80/443 directly
    env_file: ../.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates; Let's Encrypt rate-limits re-issuing them

  agent:
    build: ../agent # LiveKit Agents worker: one job per call, STT -> LLM -> TTS on this GPU
    image: voice-agent:local
    container_name: agent
    restart: always
    network_mode: host # reaches LiveKit and the model ports on 127.0.0.1
    env_file: ../.env
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880 # local signaling; .env holds the public wss:// URL for browsers
    depends_on:
      livekit: { condition: service_healthy }
      tts: { condition: service_healthy }
    volumes: [/srv/voice/logs:/logs] # turns.jsonl: per-turn latency metrics
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081')"]

volumes:
  caddy-data:
