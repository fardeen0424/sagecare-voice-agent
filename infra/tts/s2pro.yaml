# Fish S2 Pro on SGLang-Omni: preprocessing -> AR engine -> DAC vocoder, all on GPU 0.
config_cls: S2ProPipelineConfig
model_path: /models/fish-s2-pro

stages:
  tts_engine:
    engine:
      # Weights + KV cache as a share of the GPU memory still free when TTS starts (~28 GB on an
      # H100 after vLLM and STT). Weights alone need 0.27; the rest of the free memory is left for
      # preprocessing's 6 GiB reference-codec budget and the vocoder. The default 0.85 would starve them.
      mem_fraction_static: 0.5
  vocoder:
    factory:
      # Tokens (~46 ms of audio each) per audio chunk. The defaults (40, then 45) wait ~1.9 s of speech,
      # ~420 ms of generation, before a caller hears anything. A small first chunk must still hold more
      # audio than the next chunk takes to generate, or playback stalls: 5/15 stalled ~100 ms at p95,
      # 7/14 measured 322 ms to first audio with no stall (scripts/check.py).
      stream_stride: 7
      stream_followup_stride: 14
